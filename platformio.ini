; PlatformIO Project Configuration File
; โปรเจกต์: Lead Screw Linear Stage ควบคุมด้วย Cucumber RS (ESP32-S2)
; กลุ่มต้องปรับ board/upload_port ให้ตรงกับเครื่องของตัวเอง

[env:cucumber-rs]
platform = espressif32
board = esp32-s2-saola-1        ; TODO: เปลี่ยนเป็น board id ที่ตรงกับ Cucumber RS ถ้ามีไฟล์ board เฉพาะ
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ใส่ไลบรารีภายนอกที่ใช้จริงที่นี่ และระบุแหล่งที่มาใน README ด้วย (ข้อกำหนดของวิชา)
lib_deps =

build_flags =
    -D CUCUMBER_RS=1

; ตัวอย่าง environment แยกสำหรับทดสอบ unit test บนเครื่อง PC (native)
; [env:native]
; platform = native
; test_framework = unity
